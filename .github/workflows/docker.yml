name: docker

# 打 v* 标签（或手动触发）即构建镜像并推送到 ghcr。
# 镜像 tag 取 web/package.json 的 version，与软件界面右上角显示的版本同源。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: 构建并推送 ghcr（linux/amd64）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本并校验与 tag 一致
        id: meta
        run: |
          set -euo pipefail
          version="$(node -p "require('./web/package.json').version")"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:$version"
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::git tag $GITHUB_REF_NAME 与 web/package.json 的 v$version 不一致，请先改版本号再打 tag"
              exit 1
            fi
            tags="$tags
          $image:latest"
          fi
          {
            echo "image=$image"
            echo "version=$version"
            echo "tags<<TAGS"
            echo "$tags"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "推送镜像：" >> "$GITHUB_STEP_SUMMARY"
          echo "$tags" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      # ghcr 推送用仓库自带的 GITHUB_TOKEN（需要上面的 packages: write 权限），不配置任何 PAT secret
      - name: 登录 ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
